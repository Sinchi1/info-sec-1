name: Build and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests and build
        run: mvn -B -ntp verify
      - name: SAST - SpotBugs and Find Security Bugs
        run: mvn -B -ntp spotbugs:check
      - name: Upload tests and SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-sast
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
            target/spotbugs.html
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('pom.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-${{ hashFiles('pom.xml') }}-
      - name: SCA - OWASP Dependency-Check (fail on CVSS >= 7)
        run: mvn -B -ntp dependency-check:check
      - name: Save Dependency-Check database
        if: success() && steps.dependency-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: target/dependency-check-report.*
