name: Build and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests and build
        run: mvn -B -ntp verify
      - name: SAST - SpotBugs and Find Security Bugs
        run: mvn -B -ntp spotbugs:spotbugs spotbugs:check
      - name: Upload tests and SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-sast
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
            target/spotbugs.html
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SCA - OWASP Dependency-Check (fail on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp dependency-check:check
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: target/dependency-check-report.*
